<h3>Cherry Tree</h3>

<p>Individual trees bloom for only one to two weeks, with peak bloom in Washington, D.C., averaging around April 4.</p>

<p>Ornamental varieties like the Yoshino are sterile and do not produce edible fruit, while fruit-bearing trees can yield up to 7,000 cherries annually.</p>
